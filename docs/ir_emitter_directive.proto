message IrCode {
  optional int32 carrier_frequency_hertz = 1;  // e.g. 38000 for most consumer IR
  optional int32 duty_cycle = 2;               // percent
  optional int32 repeat_count = 3;
  optional int32 channel_id = 4;               // which emitter channel
